
name: Deploy HYPESOLE RumahWeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hypesole-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build
        run: test -f public/build/manifest.json

      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_APP_SERVER }}
          username: ${{ secrets.FTP_APP_USERNAME }}
          password: ${{ secrets.FTP_APP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /
          local-dir: ./
          exclude: |
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            !**/.env.example
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/bootstrap/cache/**
            **/database/*.sqlite
            **/database/*.db
            **/public/hot

      - name: Deploy public assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_PUBLIC_SERVER }}
          username: ${{ secrets.FTP_PUBLIC_USERNAME }}
          password: ${{ secrets.FTP_PUBLIC_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /
          local-dir: ./public/
          state-name: hypesole-public-sync-state.json
          exclude: |
            index.php
            .htaccess
            storage/**
            hot
