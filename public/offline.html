<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#07152f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="HYPESOLE">
	<title>Offline | HYPESOLE</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #07152f; color: #f4f7ff; }
		* { box-sizing: border-box; }
		body { display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; margin: 0; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); text-align: center; }
		main { width: min(100%, 440px); }
		img { width: 88px; height: 88px; }
		p { color: #c3d3f4; line-height: 1.65; }
		button { min-height: 48px; margin-top: 12px; padding: 0 22px; border: 0; border-radius: 12px; background: #dceaff; color: #07152f; font: inherit; font-weight: 800; cursor: pointer; }
		button:focus-visible { outline: 3px solid #6fa7ff; outline-offset: 3px; }
	</style>
</head>
<body>
	<main>
		<img src="./icons/icon-192.png" width="88" height="88" alt="HYPESOLE">
		<p style="font-size:11px;font-weight:800;letter-spacing:.22em">HYPESOLE · SNEAKER CARE & STORE</p>
		<h1>Kamu sedang offline.</h1>
		<p>Halaman dan data akun tidak disimpan offline. Sambungkan kembali ke internet untuk melanjutkan dengan aman.</p>
		<button type="button" onclick="location.reload()">COBA LAGI</button>
	</main>
</body>
</html>
